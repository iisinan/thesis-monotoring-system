services:
  - type: web
    name: tms-backend
    env: php
    plan: free
    buildCommand: composer install --no-dev && php artisan optimize
    startCommand: php artisan serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
