name: Keep Render Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render/Neon free tiers from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the application
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://thesis-monotoring-system.onrender.com/
