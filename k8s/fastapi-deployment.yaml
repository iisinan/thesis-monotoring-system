apiVersion: apps/v1
kind: Deployment
metadata:
  name: tms-plagiarism-api
  labels:
    app: tms-plagiarism-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: tms-plagiarism-api
  template:
    metadata:
      labels:
        app: tms-plagiarism-api
    spec:
      containers:
      - name: fastapi
        image: tms-plagiarism-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: tms-plagiarism-service
spec:
  selector:
    app: tms-plagiarism-api
  ports:
  - protocol: TCP
    port: 8001
    targetPort: 8001
  type: ClusterIP
